<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Service Feedback</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        body { min-height:100vh; background:linear-gradient(180deg,#f8fafc 0%,#eef2ff 100%); }
        .feedback-shell { max-width:680px; }
        .rating-button { width:54px; height:54px; border-radius:50%; }
        .rating-button.active { transform:translateY(-2px); box-shadow:0 .45rem 1rem rgba(245,158,11,.25); }
    </style>
</head>
<body class="d-flex align-items-center py-5">
<main class="container feedback-shell">
    <div class="card border-0 rounded-4 shadow-lg overflow-hidden">
        <div class="p-4 p-md-5 text-white" style="background:#1e3a8a;">
            <div class="small text-uppercase fw-bold opacity-75 mb-2">SmartSociety Maintenance</div>
            <h1 class="h3 fw-bold mb-2">How was your service?</h1>
            <div class="opacity-75" th:text="${feedback.orderReference + ' • ' + feedback.category}">ORD-EMG-0001 • Plumbing</div>
        </div>
        <div class="card-body p-4 p-md-5">
            <div class="alert alert-success" th:if="${feedback.submitted}">
                <i class="fa-solid fa-circle-check me-2"></i>Your feedback has already been submitted. You can update it below if needed.
            </div>
            <div class="d-flex justify-content-between align-items-center border rounded-3 p-3 mb-4 bg-light">
                <div>
                    <div class="small text-muted">Service Partner</div>
                    <div class="fw-bold" th:text="${feedback.partnerName}">Service Partner</div>
                </div>
                <span class="badge text-bg-success rounded-pill px-3 py-2"><i class="fa-solid fa-check me-1"></i>Completed</span>
            </div>

            <form id="feedbackForm">
                <input type="hidden" id="feedbackToken" th:value="${token}">
                <div class="mb-4">
                    <label class="form-label fw-bold">Overall rating</label>
                    <div class="d-flex gap-2 flex-wrap" id="ratingGroup">
                        <button type="button" class="btn btn-outline-warning rating-button" data-rating="1">1</button>
                        <button type="button" class="btn btn-outline-warning rating-button" data-rating="2">2</button>
                        <button type="button" class="btn btn-outline-warning rating-button" data-rating="3">3</button>
                        <button type="button" class="btn btn-outline-warning rating-button" data-rating="4">4</button>
                        <button type="button" class="btn btn-outline-warning rating-button" data-rating="5">5</button>
                    </div>
                    <input type="hidden" id="ratingValue" th:value="${feedback.rating ?: ''}">
                </div>
                <div class="mb-4">
                    <label for="reviewText" class="form-label fw-bold">Comments <span class="text-muted fw-normal">(optional)</span></label>
                    <textarea id="reviewText" class="form-control" rows="5" maxlength="1000" placeholder="Tell us about punctuality, work quality, communication, or anything we can improve..." th:text="${feedback.review}"></textarea>
                    <div class="form-text">Maximum 1000 characters.</div>
                </div>
                <button class="btn btn-primary btn-lg rounded-pill px-4 fw-bold w-100" id="submitFeedbackBtn" type="submit">
                    <i class="fa-solid fa-paper-plane me-2"></i>Submit Feedback
                </button>
                <div id="feedbackMessage" class="mt-3"></div>
            </form>
        </div>
    </div>
</main>
<script th:inline="javascript">
    (() => {
        const orderReference = /*[[${orderReference}]]*/ '';
        const ratingInput = document.getElementById('ratingValue');
        const buttons = Array.from(document.querySelectorAll('[data-rating]'));
        const render = () => {
            const selected = Number(ratingInput.value || 0);
            buttons.forEach(btn => {
                const active = Number(btn.dataset.rating) === selected;
                btn.classList.toggle('active', active);
                btn.classList.toggle('btn-warning', active);
                btn.classList.toggle('btn-outline-warning', !active);
            });
        };
        buttons.forEach(btn => btn.addEventListener('click', () => { ratingInput.value = btn.dataset.rating; render(); }));
        render();

        document.getElementById('feedbackForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const rating = Number(ratingInput.value || 0);
            const message = document.getElementById('feedbackMessage');
            if (rating < 1 || rating > 5) {
                message.innerHTML = '<div class="alert alert-warning">Please select a rating from 1 to 5.</div>';
                return;
            }
            const button = document.getElementById('submitFeedbackBtn');
            const original = button.innerHTML;
            button.disabled = true;
            button.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i>Submitting...';
            try {
                const response = await fetch(`/api/maintenance/feedback/${encodeURIComponent(orderReference)}`, {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ rating, review: document.getElementById('reviewText').value, token: document.getElementById('feedbackToken').value })
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(data.message || 'Unable to submit feedback.');
                message.innerHTML = '<div class="alert alert-success"><i class="fa-solid fa-circle-check me-2"></i>Thank you. Your feedback has been recorded.</div>';
            } catch (error) {
                message.innerHTML = `<div class="alert alert-danger">${String(error.message || error)}</div>`;
            } finally {
                button.disabled = false;
                button.innerHTML = original;
            }
        });
    })();
</script>
</body>
</html>

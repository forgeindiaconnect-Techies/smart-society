spring:
  thymeleaf:
    cache: false
  application:
    name: smartapartment
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
  datasource:
    # Stored on disk so society, subscription, billing and notice updates survive restarts.
    url: ${DB_URL:jdbc:h2:file:./data/smartsociety;AUTO_SERVER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    open-in-view: ${OPEN_IN_VIEW:false}
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}

server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:false}

app:
  mail:
    from: ${APP_MAIL_FROM:${SMTP_USERNAME:no-reply@smartapartment.local}}
  # Configure both PROPERTYDIRECT_CONTACT_EMAIL and SMTP settings in production
  # to deliver contact-message notifications to the support team.
  propertydirect:
    contact-recipient: ${PROPERTYDIRECT_CONTACT_EMAIL:}
  jwt:
    secret: ${JWT_SECRET:this_is_a_very_secure_and_long_jwt_secret_for_local_dev_12345}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}

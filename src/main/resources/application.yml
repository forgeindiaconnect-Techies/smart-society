spring:
  thymeleaf:
    cache: false
  application:
    name: smartapartment
  datasource:
    # Stored on disk so society, subscription, billing and notice updates survive restarts.
    url: ${DB_URL:jdbc:h2:file:./data/smartsociety;AUTO_SERVER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    open-in-view: ${OPEN_IN_VIEW:false}
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}

server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:false}

app:
  jwt:
    secret: ${JWT_SECRET:this_is_a_very_secure_and_long_jwt_secret_for_local_dev_12345}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - Smart Society'">Smart Society</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <!-- Animate.css for Animations -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Shared project typography: one readable font system across every dashboard. -->
    <link rel="stylesheet" th:href="@{/shared/css/typography.css(v='20260818-readable-type-v1')}">
    
    <!-- Custom Bootstrap Theme Overrides -->
    <link rel="stylesheet" th:href="@{/smartapartment/css/theme-bootstrap.css?v=20260818-readable-type-v1}">
    <link rel="stylesheet" th:href="@{/smartapartment/css/ai-helpdesk.css?v=1}">
</head>
<body>

    <!-- Sidebar Fragment -->
    <div th:fragment="sidebar" class="sidebar bg-dark text-white shadow-lg animate__animated animate__fadeInLeft" id="sidebar">
        <div class="sidebar-header p-4 border-bottom border-secondary d-flex align-items-center gap-3">
            <i class="fa-solid fa-building fa-2x text-primary animate__animated animate__pulse animate__infinite"></i>
            <h4 class="mb-0 fw-bold">Smart<span class="text-primary">Society</span></h4>
        </div>
        <nav class="nav flex-column py-3" id="sidebarNav">
            <!-- Navigation links will be injected here via JS or Thymeleaf, but for now we keep the structure generic -->
        </nav>
        <div class="sidebar-footer p-3 mt-auto border-top border-secondary text-center">
            <button class="btn btn-outline-light w-100 rounded-pill" onclick="window.location.href='/'">
                <i class="fa-solid fa-sign-out-alt me-2"></i> Log Out
            </button>
        </div>
    </div>

    <!-- Scripts Fragment -->
    <div th:fragment="scripts">
        <!-- Bootstrap Bundle with Popper -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        
        <!-- Application Logic -->
        <!-- Versioned so dashboard button fixes are not hidden by a browser cache. -->
    <script th:src="@{/smartapartment/js/dashboard.js(v='20260818-maintenance-assets')}"></script>
        <script th:src="@{/smartapartment/js/ai-helpdesk.js?v=1}"></script>
    </div>

</body>
</html>
